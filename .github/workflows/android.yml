name: Build MAGMITE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MAGMITE project
        run: unzip -o "MAGMITE-AI-project-v4.zip.zip" -d project
      - name: Check project files
        run: |
          echo "=== Project structure ==="
          find project -maxdepth 5 -type f | head -100
      - name: Find Kotlin source files
        run: |
          echo "=== Kotlin source files ==="
          find project -type f -name "*.kt"
      - name: Show MainActivity code
        run: |
          echo "=== MainActivity.kt ==="
          find project -name "MainActivity.kt" -exec cat {} \;

      - name: Check extracted files
        run: |
          echo "=== Project files ==="
          find project -maxdepth 4 -type f | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd "$(find project -name settings.gradle.kts -exec dirname {} \; | head -1)"
          gradle assembleDebug

      - name: Find APK
        run: find project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAGMITE-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
